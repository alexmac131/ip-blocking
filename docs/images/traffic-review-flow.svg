<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390" role="img" aria-labelledby="title description">
  <title id="title">Traffic review and blocking process</title>
  <desc id="description">Nginx access logs are analyzed. Known routes and assets are treated as likely legitimate. Unknown requests are checked for scan signatures or repeated errors. Suspected activity is recorded and reviewed by an operator. False positives remain unblocked; confirmed abusive IPs are added to the reviewed block list and synchronized to Nginx for future requests.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52657a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b4d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #425466; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-copy { font-size: 15px; fill: #344563; }
      .branch { font-size: 14px; font-weight: 700; }
      .box { stroke-width: 2; rx: 14; }
      .neutral { fill: #f4f7fb; stroke: #8a9bb0; }
      .legal { fill: #e6f4ea; stroke: #388659; }
      .suspect { fill: #fff3d6; stroke: #c28a18; }
      .review { fill: #eaf1ff; stroke: #4a70bd; }
      .block { fill: #fde9e7; stroke: #c9372c; }
      .line { fill: none; stroke: #52657a; stroke-width: 2.5; marker-end: url(#arrow); }
      .line-dashed { fill: none; stroke: #52657a; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1390" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="title">Traffic review and blocking process</text>
  <text x="600" y="82" text-anchor="middle" class="subtitle">Detection produces candidates for human review; it does not automatically block requests.</text>

  <rect x="410" y="112" width="380" height="76" class="box neutral"/>
  <text x="600" y="143" text-anchor="middle" class="node-title">Nginx access logs</text>
  <text x="600" y="168" text-anchor="middle" class="node-copy">Request path, client IP, method, and response status</text>

  <path d="M600 188 V225" class="line"/>
  <polygon points="600,225 780,300 600,375 420,300" fill="#f4f7fb" stroke="#8a9bb0" stroke-width="2"/>
  <text x="600" y="291" text-anchor="middle" class="node-title">Known route or</text>
  <text x="600" y="315" text-anchor="middle" class="node-title">static asset?</text>

  <path d="M420 300 H245 V414" class="line"/>
  <text x="316" y="286" text-anchor="middle" class="branch" fill="#247a48">YES</text>
  <rect x="75" y="414" width="340" height="70" class="box legal"/>
  <text x="245" y="443" text-anchor="middle" class="node-title">Likely legitimate traffic</text>
  <text x="245" y="466" text-anchor="middle" class="node-copy">Exclude from scan candidates; do not block</text>

  <path d="M600 375 V454" class="line"/>
  <text x="628" y="413" class="branch">NO / UNKNOWN</text>
  <polygon points="600,454 790,528 600,602 410,528" fill="#fff3d6" stroke="#c28a18" stroke-width="2"/>
  <text x="600" y="518" text-anchor="middle" class="node-title">Scan signature or repeated</text>
  <text x="600" y="542" text-anchor="middle" class="node-title">unknown errors?</text>

  <path d="M410 528 H245 V602" class="line"/>
  <text x="319" y="515" text-anchor="middle" class="branch" fill="#247a48">NO</text>
  <rect x="75" y="602" width="340" height="92" class="box legal"/>
  <text x="245" y="636" text-anchor="middle" class="node-title">Unclassified / not flagged</text>
  <text x="245" y="663" text-anchor="middle" class="node-copy">No automatic block; investigate if needed</text>

  <path d="M790 528 H955 V602" class="line"/>
  <text x="869" y="515" text-anchor="middle" class="branch" fill="#9a6700">YES</text>
  <rect x="785" y="602" width="340" height="92" class="box suspect"/>
  <text x="955" y="636" text-anchor="middle" class="node-title">Suspected scan candidate</text>
  <text x="955" y="663" text-anchor="middle" class="node-copy">Report IP, paths, counts, and statuses</text>

  <path d="M955 694 V732" class="line"/>
  <rect x="785" y="732" width="340" height="86" class="box suspect"/>
  <text x="955" y="766" text-anchor="middle" class="node-title">Collect attempted paths</text>
  <text x="955" y="792" text-anchor="middle" class="node-copy">Keep persistent history and checkpoints</text>

  <path d="M785 775 H600 V864" class="line"/>
  <rect x="400" y="864" width="400" height="86" class="box review"/>
  <text x="600" y="898" text-anchor="middle" class="node-title">Operator reviews the evidence</text>
  <text x="600" y="924" text-anchor="middle" class="node-copy">Check route context, statuses, and IP attribution</text>

  <path d="M600 950 V985" class="line"/>
  <polygon points="600,985 790,1060 600,1135 410,1060" fill="#eaf1ff" stroke="#4a70bd" stroke-width="2"/>
  <text x="600" y="1054" text-anchor="middle" class="node-title">Is the activity confirmed</text>
  <text x="600" y="1078" text-anchor="middle" class="node-title">abusive?</text>

  <path d="M410 1060 H245 V1162" class="line-dashed"/>
  <text x="318" y="1046" text-anchor="middle" class="branch" fill="#315da8">NO / UNCERTAIN</text>
  <rect x="75" y="1162" width="340" height="90" class="box legal"/>
  <text x="245" y="1197" text-anchor="middle" class="node-title">Leave unblocked</text>
  <text x="245" y="1224" text-anchor="middle" class="node-copy">Monitor or refine route configuration</text>

  <path d="M790 1060 H955 V1162" class="line"/>
  <text x="872" y="1046" text-anchor="middle" class="branch" fill="#a12b24">YES</text>
  <rect x="785" y="1162" width="340" height="90" class="box block"/>
  <text x="955" y="1197" text-anchor="middle" class="node-title">Add reviewed IP/CIDR</text>
  <text x="955" y="1224" text-anchor="middle" class="node-copy">Update the block list deliberately</text>

  <path d="M955 1252 V1285" class="line"/>
  <rect x="785" y="1285" width="340" height="76" class="box block"/>
  <text x="955" y="1317" text-anchor="middle" class="node-title">Sync Nginx deny rules</text>
  <text x="955" y="1342" text-anchor="middle" class="node-copy">Future matching requests are denied</text>
</svg>
